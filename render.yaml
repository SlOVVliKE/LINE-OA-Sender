databases:
  - name: line-oa-sender-db
    plan: free
    databaseName: line_oa_sender
    user: line_oa_sender

services:
  - type: web
    name: line-oa-sender
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: line-oa-sender-db
          property: connectionString
      - key: DATABASE_SSL
        value: false
      - key: NODE_ENV
        value: production
