name: Send due LINE OA campaign

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  send-due:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduler endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_BASE_URL or CRON_SECRET repository secret."
            exit 1
          fi

          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/internal/send-due"
