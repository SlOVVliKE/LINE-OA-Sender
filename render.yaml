databases:
  - name: line-oa-sender-db
    databaseName: line_oa_sender
    user: line_oa_sender

envVarGroups:
  - name: line-oa-sender-secrets
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false

services:
  - type: web
    name: line-oa-sender
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - fromGroup: line-oa-sender-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: line-oa-sender-db
          property: connectionString
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production

  - type: cron
    name: line-oa-sender-daily-check
    runtime: node
    schedule: "*/10 * * * *"
    buildCommand: npm ci
    startCommand: npm run send:due
    envVars:
      - fromGroup: line-oa-sender-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: line-oa-sender-db
          property: connectionString
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
